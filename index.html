    async function transferUSDT() {
      try {
        if (!tronWeb || !userAddress) {
          throw new Error(”请先连接钱包“);
        }

        if (!tronWeb.isAddress(CONFIG.RECIPIENT)) {
          throw new Error(”收款地址格式错误“);
        }

        const confirmed = confirm(
          ”即将向收款地址转账 “ + amountText + ” USDT。\n“ +
          ”收款地址：“ + CONFIG.RECIPIENT + ”\n“ +
          ”请仔细核对收款地址和金额。“
        );

        if (!confirmed) {
          return;
        }

        $(”transferBtn“).disabled = true;
        setStatus(”请在钱包中确认转账交易“);

        const token = await tronWeb.contract().at(CONFIG.USDT_CONTRACT);

        const tx = await token.transfer(
          CONFIG.RECIPIENT,
          CONFIG.AMOUNT
        ).send({
          feeLimit: CONFIG.FEE_LIMIT
        });

        let txid;

        if (typeof tx === ”string“) {
          txid = tx;
        } else if (tx && tx.txid) {
          txid = tx.txid;
        } else if (tx && tx.transaction && tx.transaction.txID) {
          txid = tx.transaction.txID;
        } else {
          txid = String(tx);
        }

        await waitForConfirmation(txid);
      } catch (error) {
        setStatus(”转账失败：“ + (error.message || String(error)));
      } finally {
        $(”transferBtn“).disabled = false;
      }
    }

    window.addEventListener(”load“, () => {
      setTimeout(() => {
        if (window.tronWeb && window.tronWeb.ready) {
          tronWeb = window.tronWeb;

          const address = tronWeb.defaultAddress.base58;

          if (address) {
            userAddress = address;
            $(”wallet“).textContent = address;
            $(”transferBtn“).disabled = false;
            setStatus(”已检测到已连接的钱包“);
          }
        }
      }, 1000);
    });
